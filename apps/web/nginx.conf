# `api` resolves to every API replica; nginx round-robins across them, so a producer's POST and a
# user's WebSocket usually land on different instances (Redis pub/sub bridges the gap).
# Re-resolve through Docker's DNS so recreated/scaled API containers are picked up without an
# nginx restart (a plain `server api:3000` is resolved once at startup and goes stale).
resolver 127.0.0.11 valid=5s ipv6=off;

upstream api {
  zone api 64k;
  server api:3000 resolve;
}

server {
  listen 80;
  root /usr/share/nginx/html;

  # ^~ makes this prefix win over the regex location below (regexes otherwise take precedence).
  location ^~ /v1/ws {
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 1h;
  }

  location ~ ^/(v1|demo|metrics|health|ready) {
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
  }

  location / {
    try_files $uri /index.html;
  }
}
